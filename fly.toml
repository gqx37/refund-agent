# Fly.io config for the refund-agent service.
# Deploy from the repo root: flyctl deploy
#
# Secrets (set once, not in this file):
#   flyctl secrets set FIREWORKS_API_KEY=… STRIPE_API_KEY=… \
#                      NEO4J_PASSWORD=… NEO4J_URI=bolt://refund-agent-neo4j.internal:7687

app            = "refund-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy     = "bluegreen"  # boot new machines, health-check, cut over, destroy old
  wait_timeout = "120s"

[env]
  ENV                = "production"
  PORT               = "8080"
  NEO4J_URI          = "bolt://refund-agent-neo4j.internal:7687"  # 6PN private networking
  NEO4J_DATABASE     = "neo4j"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "suspend"  # ~$0 idle, sub-second wake; graph state is external
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 40
    hard_limit = 80

  # Readiness gates routing (touches Neo4j); liveness stays with the container
  # healthcheck. A failing readiness check stops routing, it does not restart.
  [[http_service.checks]]
    grace_period = "10s"
    interval     = "15s"
    method       = "GET"
    path         = "/health/ready"
    protocol     = "http"
    timeout      = "5s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
