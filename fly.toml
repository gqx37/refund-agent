# Fly.io config for the refund-agent service — one small machine, everything in
# process (SQLite fact store on a tiny volume). Deploy from the repo root:
#   flyctl deploy
#
# Secrets (set once, not in this file):
#   flyctl secrets set FIREWORKS_API_KEY=… STRIPE_API_KEY=…
# Then seed the store on the machine (creates real Stripe test charges):
#   flyctl ssh console -C "python -m scripts.seed"

app            = "refund-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV           = "production"
  PORT          = "8080"
  STORE_DB_PATH = "/data/refund_agent.db"

[mounts]
  source      = "refund_data"
  destination = "/data"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "suspend"  # ~$0 idle; SQLite lives on the volume, survives suspend
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "10s"
    interval     = "15s"
    method       = "GET"
    path         = "/health/ready"
    protocol     = "http"
    timeout      = "5s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
