# Fly.io config for the refund agent's semantic fact store.
#
# Deploy (build context is this directory):
#   flyctl deploy infra/neo4j -c infra/neo4j/fly.toml --ha=false
#
# Private-only: no public IPs. The refund-agent service reaches it over 6PN
# private networking at bolt://refund-agent-neo4j.internal:7687. Auth is the
# NEO4J_AUTH secret (format `neo4j/<password>`). For local access (seed, Browser):
#   flyctl proxy 7688:7687 -a refund-agent-neo4j    # bolt
#   flyctl proxy 7474:7474 -a refund-agent-neo4j    # http/Browser
#
# Always-on (no auto_stop): the graph must stay reachable for the agent even while
# the service machine is scaled to zero. The dataset is tiny; a 1GB VM is plenty.

app            = "refund-agent-neo4j"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NEO4J_server_default__listen__address  = "0.0.0.0"
  NEO4J_server_memory_heap_initial__size = "512m"
  NEO4J_server_memory_heap_max__size     = "512m"
  NEO4J_server_memory_pagecache_size     = "256m"

[mounts]
  source      = "neo4j_data"
  destination = "/data"

[[vm]]
  size   = "shared-cpu-1x"
  memory = 1024
