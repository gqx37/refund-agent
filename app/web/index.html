<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Refund Agent</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --ink: #1a1a1e; --muted: #6b6b76;
    --line: #e6e6ea; --user: #e8eefc; --accent: #2f6df6;
    --ok: #1c8a4b; --ok-bg: #e7f6ec; --deny: #c02626; --deny-bg: #fbe9e9;
    --esc: #9a6400; --esc-bg: #fbf1dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #1f1f24; --ink: #ececf1; --muted: #9a9aa6;
      --line: #2c2c33; --user: #23324f; --accent: #5b8bff;
      --ok: #57d38c; --ok-bg: #16311f; --deny: #ff8080; --deny-bg: #3a1c1c;
      --esc: #e6b95a; --esc-bg: #35290f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  header button.reset {
    font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  .chips { padding: 10px 20px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button {
    font-size: 12.5px; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; max-width: 88%; white-space: pre-wrap; word-wrap: break-word;
  }
  .row.user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .turn { display: flex; flex-direction: column; gap: 8px; max-width: 88%; }

  .trace {
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden;
  }
  .trace .hd {
    font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  .step { padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: 0; }
  .step .call { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .step .call b { font-weight: 650; }
  .step .args { color: var(--muted); }
  .step .result { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 650; padding: 1px 8px; border-radius: 999px;
    margin-left: 8px; vertical-align: middle;
  }
  .badge.approve { color: var(--ok); background: var(--ok-bg); }
  .badge.deny { color: var(--deny); background: var(--deny-bg); }
  .badge.escalate { color: var(--esc); background: var(--esc-bg); }

  .review {
    border: 1px solid var(--esc); background: var(--esc-bg); border-radius: 12px; padding: 12px 14px;
  }
  .review h3 { margin: 0 0 6px; font-size: 13.5px; color: var(--esc); }
  .review ul { margin: 6px 0 10px; padding-left: 18px; color: var(--ink); font-size: 13px; }
  .review .actions { display: flex; gap: 8px; }
  .review button {
    font-size: 13.5px; font-weight: 600; border-radius: 8px; padding: 7px 16px; cursor: pointer; border: 0;
  }
  .review .approve { background: var(--ok); color: #fff; }
  .review .deny { background: var(--deny); color: #fff; }
  .review button:disabled { opacity: .5; cursor: default; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 20px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  .composer input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 15px;
  }
  .composer input:focus { outline: none; border-color: var(--accent); }
  .composer button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 18px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .composer button:disabled { opacity: .5; cursor: default; }
  .dots span { animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
</style>
</head>
<body>
  <header>
    <h1>Refund Agent</h1>
    <span class="sub">policy guardrail on every refund &middot; real Stripe test mode</span>
    <span class="spacer"></span>
    <button class="reset" onclick="resetChat()">New chat</button>
  </header>
  <div class="chips" id="chips"></div>
  <main><div class="wrap" id="log"></div></main>
  <footer>
    <form class="composer" id="composer" onsubmit="return send(event)">
      <input id="input" autocomplete="off" placeholder="e.g. I'm Alice Nguyen, can you show my orders?" />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </footer>

<script>
const SAMPLES = [
  "I'm Alice Nguyen, show my orders",
  "refund SO-10432, it arrived broken",
  "refund SO-10440 in full",
  "refund SO-10329",
];
let threadId = null;
let busy = false;

const log = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

const chips = document.getElementById("chips");
SAMPLES.forEach(s => {
  const b = document.createElement("button");
  b.textContent = s;
  b.onclick = () => { if (!busy) { input.value = s; send(); } };
  chips.appendChild(b);
});

function resetChat() { threadId = null; log.innerHTML = ""; input.focus(); }
function esc(s) { return (s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function scroll() { document.querySelector("main").scrollTop = 1e9; }

function addUser(text) {
  log.appendChild(el(`<div class="row user"><div class="bubble">${esc(text)}</div></div>`));
  scroll();
}

function fmtArgs(args) {
  const parts = Object.entries(args || {})
    .filter(([, v]) => v !== null && v !== undefined && v !== "")
    .map(([k, v]) => `${k}=${esc(String(v))}`);
  return parts.length ? `(${parts.join(", ")})` : "()";
}

function renderTrace(trace) {
  if (!trace || !trace.length) return "";
  const steps = trace.map(s => {
    const badge = s.guardrail ? `<span class="badge ${s.guardrail}">guardrail: ${s.guardrail}</span>` : "";
    const result = s.result ? `<div class="result">${esc(s.result)}</div>` : "";
    return `<div class="step">
      <div class="call"><b>${esc(s.name)}</b><span class="args">${fmtArgs(s.args)}</span>${badge}</div>
      ${result}</div>`;
  }).join("");
  return `<div class="trace"><div class="hd">agent trace</div>${steps}</div>`;
}

function renderReview(review) {
  const reasons = (review.policy_reasons || []).map(r => `<li>${esc(r)}</li>`).join("");
  const amount = (review.amount_cents / 100).toFixed(2);
  return `<div class="review">
    <h3>Human review required &middot; $${amount} on ${esc(review.order_id)}</h3>
    <ul>${reasons}</ul>
    <div class="actions">
      <button class="approve" onclick="resolve(true, this)">Approve refund</button>
      <button class="deny" onclick="resolve(false, this)">Deny</button>
    </div></div>`;
}

function addAgentTurn(data) {
  const turn = el(`<div class="row agent"><div class="turn"></div></div>`);
  const box = turn.querySelector(".turn");
  const trace = renderTrace(data.trace);
  if (trace) box.appendChild(el(trace));
  if (data.status === "escalated") {
    box.appendChild(el(renderReview(data.review)));
  } else if (data.reply) {
    box.appendChild(el(`<div class="bubble">${esc(data.reply)}</div>`));
  }
  log.appendChild(turn);
  scroll();
}

function addThinking() {
  const t = el(`<div class="row agent" id="thinking"><div class="bubble dots"><span>&bull;</span><span>&bull;</span><span>&bull;</span></div></div>`);
  log.appendChild(t); scroll();
}
function clearThinking() { const t = document.getElementById("thinking"); if (t) t.remove(); }

function setBusy(b) { busy = b; sendBtn.disabled = b; input.disabled = b; }

async function post(url, body) {
  const r = await fetch(url, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function send(ev) {
  if (ev) ev.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return false;
  addUser(text); input.value = ""; setBusy(true); addThinking();
  try {
    const data = await post("/v1/chat", { message: text, thread_id: threadId });
    threadId = data.thread_id;
    clearThinking(); addAgentTurn(data);
  } catch (e) {
    clearThinking();
    log.appendChild(el(`<div class="row agent"><div class="bubble">Something went wrong (${esc(e.message)}). Try again.</div></div>`));
  } finally { setBusy(false); input.focus(); }
  return false;
}

async function resolve(approve, btn) {
  const actions = btn.parentElement;
  actions.querySelectorAll("button").forEach(b => b.disabled = true);
  setBusy(true); addThinking();
  try {
    const data = await post(`/v1/chat/${threadId}/resume`, { approve });
    clearThinking(); addAgentTurn(data);
  } catch (e) {
    clearThinking();
    log.appendChild(el(`<div class="row agent"><div class="bubble">Resume failed (${esc(e.message)}).</div></div>`));
  } finally { setBusy(false); input.focus(); }
}

input.focus();
</script>
</body>
</html>
