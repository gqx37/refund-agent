<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Refund Agent</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #16161a;
    --muted: #8a8a94;
    --bubble: #f5f5f7;
    --bubble-user: #f5f5f7;
    --line: #e7e7ea;
    --accent: #2f6df6;
    --ok: #12874a; --ok-bg: #e8f5ee;
    --deny: #c33; --deny-bg: #fbecec;
    --hold: #9a6a00; --hold-bg: #fbf2df;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15.5px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  .topbar { display: flex; align-items: center; padding: 13px 20px; position: sticky; top: 0; background: rgba(255,255,255,.86); backdrop-filter: blur(8px); z-index: 5; }
  .topbar .spacer { flex: 1; }
  .topbar .reset { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 5px 9px; border-radius: 8px; }
  .topbar .reset:hover { color: var(--ink); background: var(--bubble); }
  .topbar .reset svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 760px; margin: 0 auto; padding: 6px 20px 24px; display: flex; flex-direction: column; gap: 20px; }

  /* Empty state */
  .empty { text-align: center; padding: 13vh 8px 0; }
  .empty h2 { font-size: 26px; font-weight: 680; letter-spacing: -.02em; margin: 0 0 8px; }
  .empty p { color: var(--muted); margin: 0 auto 24px; max-width: 420px; }
  .suggest { display: grid; grid-template-columns: 1fr; gap: 9px; max-width: 520px; margin: 0 auto; }
  @media (min-width: 620px) { .suggest { grid-template-columns: 1fr 1fr; } }
  .suggest button { font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 13px; padding: 12px 15px; cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
  .suggest button:hover { border-color: var(--accent); background: var(--bubble); }

  .msg { display: flex; flex-direction: column; gap: 9px; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble { background: var(--bubble-user); padding: 11px 15px; border-radius: 16px; border-bottom-right-radius: 6px; max-width: 82%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.assistant .body { max-width: 88%; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

  /* Tool chips (gray, tap to open dialog) */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12.5px; color: var(--ink); background: var(--bubble); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 10px; cursor: pointer; animation: pop .18s ease-out; line-height: 1; }
  .chip:hover { border-color: #d5d5da; }
  .chip svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .chip .spin { width: 11px; height: 11px; border: 2px solid #d9d9df; border-top-color: var(--muted); border-radius: 50%; animation: spin .7s linear infinite; }
  .chip.approve { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
  .chip.deny { color: var(--deny); background: var(--deny-bg); border-color: transparent; }
  .chip.hold { color: var(--hold); background: var(--hold-bg); border-color: transparent; }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Assistant answer: plain while streaming, wrapped in a bubble once finished */
  .md { color: var(--ink); }
  .md.boxed { background: var(--bubble); padding: 12px 16px; border-radius: 16px; border-bottom-left-radius: 6px; }
  .md.escalated { background: var(--hold-bg); padding: 12px 16px; border-radius: 16px; border-bottom-left-radius: 6px; }
  .md p { margin: 0 0 10px; }
  .md p:last-child, .md ul:last-child, .md ol:last-child { margin-bottom: 0; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md li::marker { color: var(--muted); }
  .md strong { font-weight: 660; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; background: rgba(0,0,0,.05); padding: 1px 5px; border-radius: 5px; }
  .md h3, .md h4 { font-size: 15.5px; font-weight: 660; margin: 4px 0 6px; }
  .caret { display: inline-block; width: 8px; height: 1.05em; background: var(--muted); vertical-align: -2px; margin-left: 3px; border-radius: 1.5px; animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .meta { display: flex; gap: 4px; margin-top: -2px; opacity: 0; transition: opacity .15s; }
  .msg.assistant:hover .meta { opacity: 1; }
  .meta button { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 3px 7px; border-radius: 7px; }
  .meta button:hover { background: var(--bubble); color: var(--ink); }
  .meta svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* Tool dialog */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.34); display: grid; place-items: center; z-index: 50; padding: 20px; animation: fade .12s ease-out; }
  .modal[hidden] { display: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal-card { background: var(--bg); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); width: 100%; max-width: 520px; max-height: 76vh; display: flex; flex-direction: column; overflow: hidden; animation: rise .16s cubic-bezier(.16,1,.3,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .modal-head .mi { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
  .modal-head .mt { font-weight: 640; font-size: 14.5px; }
  .modal-head .spacer { flex: 1; }
  .modal-close { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 7px; }
  .modal-close:hover { background: var(--bubble); color: var(--ink); }
  .modal-body { padding: 14px 16px; overflow-y: auto; }
  .modal-body .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 5px; }
  .modal-body .k + .v { margin-bottom: 14px; }
  .modal-body .v { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; background: var(--bubble); padding: 10px 12px; border-radius: 10px; }
  .modal-body .v:last-child { margin-bottom: 0; }
  .modal-body ul.reasons { margin: 0; padding-left: 20px; }
  .modal-body ul.reasons li { margin: 3px 0; font-size: 13px; }

  /* Composer */
  footer { padding: 8px 20px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 72%, transparent); position: sticky; bottom: 0; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 4px 5px 4px 16px; box-shadow: var(--shadow); }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: var(--ink); font: inherit; padding: 6px 0; max-height: 140px; line-height: 1.45; }
  .composer .send { flex: none; width: 34px; height: 30px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; align-self: flex-end; transition: opacity .15s, transform .05s; }
  .composer .send:disabled { opacity: .3; cursor: default; }
  .composer .send:not(:disabled):active { transform: scale(.95); }
  .composer .send svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="topbar"><span class="spacer"></span><button class="reset" onclick="resetChat()"><svg viewBox="0 0 24 24"><path d="M15.5 4.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/><path d="M13.5 6.5l3 3"/></svg><span>New chat</span></button></div>

  <main><div class="thread" id="thread"></div></main>

  <footer>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Ask about a refund..." autofocus></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </form>
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span id="modalIcon"></span><span class="mt" id="modalTitle"></span><span class="spacer"></span><button class="modal-close" aria-label="Close">&times;</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

<script>
const SUGGEST = [
  "I'm Alice Carter, show my orders",
  "Refund SO-10432, it arrived broken",
  "Refund SO-10440 in full",
  "Refund SO-10377",
];

const ICONS = {
  find_customer: '<svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.2"/><path d="M4.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17.5" cy="15.5" r="2.4"/><path d="M19.4 17.4 21.5 19.5"/></svg>',
  list_orders:   '<svg viewBox="0 0 24 24"><path d="M8 6h11M8 12h11M8 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
  order_lookup:  '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="M20 20l-3.6-3.6M9 9h4M9 12h4"/></svg>',
  issue_refund:  '<svg viewBox="0 0 24 24"><path d="M9 7H6a3 3 0 0 0-3 3v0a3 3 0 0 0 3 3h9a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3h-3"/><path d="M12 4 9 7l3 3"/></svg>',
  policy:        '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.4-3 7.6-7 8.9C8 18.6 5 15.4 5 11V6l7-3Z"/><path d="M9 11.5l2 2 4-4"/></svg>',
};
const LABELS = { find_customer: "Finding your account", list_orders: "Pulling up orders", order_lookup: "Checking the order", issue_refund: "Processing refund", policy: "Policy check" };
const CARET = '<span class="caret"></span>';
const COPY_ICON = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg>';

let threadId = null, busy = false;
const thread = document.getElementById("thread");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const form = document.getElementById("composer");
const modal = document.getElementById("modal");

function esc(s){ return (s??"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function scroll(){ const m=document.querySelector("main"); m.scrollTop=m.scrollHeight; }

// Render markdown, then tuck the caret inline at the end of the last line.
function renderStreaming(node, raw){
  node.innerHTML = md(raw);
  let host = node.lastElementChild;
  if(host && (host.tagName === "UL" || host.tagName === "OL")) host = host.lastElementChild || host;
  (host || node).insertAdjacentHTML("beforeend", CARET);
}

// Minimal, safe markdown: escape first, then bold / italic / code / lists / headings.
function md(src){
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/`([^`]+?)`/g, "<code>$1</code>");
  const lines = (src||"").replace(/\r/g,"").split("\n");
  let out="", i=0;
  const listRe = /^\s*([-*]|\d+\.)\s+/;
  while(i < lines.length){
    if(/^\s*[-*]\s+/.test(lines[i])){ out+="<ul>"; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ out+="<li>"+inline(lines[i].replace(/^\s*[-*]\s+/,""))+"</li>"; i++; } out+="</ul>"; continue; }
    if(/^\s*\d+\.\s+/.test(lines[i])){ out+="<ol>"; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ out+="<li>"+inline(lines[i].replace(/^\s*\d+\.\s+/,""))+"</li>"; i++; } out+="</ol>"; continue; }
    const h = lines[i].match(/^(#{1,3})\s+(.*)/);
    if(h){ out+="<h4>"+inline(h[2])+"</h4>"; i++; continue; }
    if(lines[i].trim()===""){ i++; continue; }
    const para=[]; while(i<lines.length && lines[i].trim()!=="" && !listRe.test(lines[i]) && !/^#{1,3}\s+/.test(lines[i])){ para.push(lines[i]); i++; }
    out+="<p>"+para.map(inline).join("<br>")+"</p>";
  }
  return out;
}

function renderEmpty(){
  const wrap = el(`<div class="empty"><h2>Refund Agent</h2>
    <p>Look up an order or customer, then request a refund. Policy is checked on every one.</p>
    <div class="suggest"></div></div>`);
  const box = wrap.querySelector(".suggest");
  SUGGEST.forEach(s => { const b=el(`<button>${esc(s)}</button>`); b.onclick=()=>{ input.value=s; submit(); }; box.appendChild(b); });
  thread.appendChild(wrap);
}
function clearEmpty(){ thread.querySelector(".empty")?.remove(); }
function resetChat(){ threadId=null; thread.innerHTML=""; renderEmpty(); input.focus(); }

function addUser(text){
  clearEmpty();
  thread.appendChild(el(`<div class="msg user"><div class="bubble">${esc(text)}</div></div>`));
  scroll();
}

// Tool dialog
function openTool(rec){
  document.getElementById("modalIcon").innerHTML = (ICONS[rec.name]||"").replace("<svg", '<svg class="mi"');
  document.getElementById("modalTitle").textContent = LABELS[rec.name] || rec.name;
  const body = document.getElementById("modalBody");
  if(rec.name === "policy"){
    const reasons = (rec.reasons||[]).map(r => `<li>${esc(r)}</li>`).join("") || "<li>no rules recorded</li>";
    body.innerHTML = `<div class="k">Decision</div><div class="v">${esc(rec.outcome)}</div>`
      + `<div class="k">Rules evaluated</div><ul class="reasons">${reasons}</ul>`;
  } else {
    const argStr = Object.entries(rec.args||{}).filter(([,v]) => v!==null&&v!==undefined&&v!=="").map(([k,v]) => `${k}: ${v}`).join("\n") || "none";
    body.innerHTML = `<div class="k">Input</div><div class="v">${esc(argStr)}</div>`
      + `<div class="k">Result</div><div class="v">${esc(rec.result || (rec.result===null ? "running..." : "none"))}</div>`;
  }
  modal.hidden = false;
}
function closeModal(){ modal.hidden = true; }
modal.addEventListener("click", e => { if(e.target === modal || e.target.closest(".modal-close")) closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && !modal.hidden) closeModal(); });

function newAssistant(){
  const node = el(`<div class="msg assistant"><div class="body">
      <div class="chips" hidden></div>
      <div class="text md" hidden></div>
      <div class="meta" hidden></div>
    </div></div>`);
  thread.appendChild(node);
  const chips = node.querySelector(".chips");
  const text = node.querySelector(".text");
  const meta = node.querySelector(".meta");
  const toolEls = {};
  let raw = "";

  // Show the blinking caret immediately as the loading ticker.
  text.hidden = false;
  text.insertAdjacentHTML("beforeend", CARET);

  function addTool(name, args){
    chips.hidden = false;
    const chip = el(`<button class="chip pending" type="button">${ICONS[name]||""}<span class="lbl">${esc(LABELS[name]||name)}</span><span class="spin"></span></button>`);
    const rec = { name, chip, args: args||{}, result: null };
    chip.onclick = () => openTool(rec);
    chips.appendChild(chip);
    (toolEls[name] = toolEls[name] || []).push(rec);
    scroll();
    return rec;
  }
  function addPolicy(ev){
    chips.hidden = false;
    const cls = ev.outcome === "approve" ? "approve" : ev.outcome === "deny" ? "deny" : "hold";
    const label = ev.outcome === "approve" ? "Policy: approved" : ev.outcome === "deny" ? "Policy: blocked" : "Policy: review needed";
    const chip = el(`<button class="chip ${cls}" type="button">${ICONS.policy}<span class="lbl">${esc(label)}</span></button>`);
    const rec = { name: "policy", outcome: ev.outcome, reasons: ev.reasons || [] };
    chip.onclick = () => openTool(rec);
    chips.appendChild(chip);
    scroll();
  }
  function finishTool(name, guardrail, content){
    if(!name) return;
    let list = toolEls[name]; let rec;
    if(!list || !list.length){ rec = addTool(name, {}); } else { rec = list[list.length-1]; }
    rec.result = content || "";
    rec.chip.querySelector(".spin")?.remove();
    rec.chip.classList.remove("pending");
    if(name === "issue_refund"){
      if(guardrail === "approve"){ rec.chip.classList.add("approve"); rec.chip.querySelector(".lbl").textContent = "Refund approved"; }
      else if(guardrail === "deny"){ rec.chip.classList.add("deny"); rec.chip.querySelector(".lbl").textContent = "Blocked by policy"; }
    }
  }
  // Stream markdown (no bubble) with a trailing box caret; wrap in a bubble on seal.
  let sealed = false;
  function seal(cls){ text.innerHTML = md(raw); text.classList.add(cls); sealed = true; }
  function token(t){ raw += t; text.hidden = false; renderStreaming(text, raw); scroll(); }
  function fill(t, {escalated=false}={}){ raw = t; text.hidden = false; seal(escalated ? "escalated" : "boxed"); scroll(); }
  function hold(){ const list = toolEls["issue_refund"]; if(list&&list.length){ const r=list[list.length-1]; r.chip.querySelector(".spin")?.remove(); r.chip.classList.remove("pending"); r.chip.classList.add("hold"); r.chip.querySelector(".lbl").textContent="Held for review"; } }
  function done(){
    if(!raw){ text.remove(); }
    else {
      if(!sealed) seal("boxed");  // drop the caret, wrap the final answer in a bubble
      meta.hidden = false;
      const copy = el(`<button title="Copy">${COPY_ICON}<span>Copy</span></button>`);
      copy.onclick = async () => { try { await navigator.clipboard.writeText(raw); copy.innerHTML = CHECK_ICON+"<span>Copied</span>"; setTimeout(()=>copy.innerHTML=COPY_ICON+"<span>Copy</span>", 1400);} catch{} };
      meta.appendChild(copy);
    }
    scroll();
  }
  return { addTool, addPolicy, finishTool, token, fill, hold, done, get raw(){ return raw; } };
}

function escalationCopy(review){
  const amount = (review.amount_cents/100).toLocaleString(undefined,{style:"currency",currency:"USD"});
  const reason = (review.policy_reasons||[]).slice(-1)[0] || "it needs a second look";
  return `This one needs a quick human sign-off before it goes through: **${amount}** on **${review.order_id}**. ${reason}\n\nReply **approve** to release the refund, or **deny** to hold it.`;
}

function setBusy(b){ busy=b; updateSend(); input.disabled=b; if(!b) input.focus(); }
function updateSend(){ sendBtn.disabled = busy || !input.value.trim(); }

async function submit(){
  const text = input.value.trim();
  if(!text || busy) return;
  addUser(text); input.value=""; autosize(); setBusy(true);
  const turn = newAssistant();
  try {
    const res = await fetch("/v1/stream", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ message:text, thread_id: threadId }) });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf="";
    while(true){
      const { value, done } = await reader.read(); if(done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i+2);
        if(line.startsWith("data:")) handle(JSON.parse(line.slice(5).trim()), turn);
      }
    }
  } catch(e){ turn.fill("Sorry, the connection dropped. Please try again."); }
  finally { turn.done(); setBusy(false); }
}

function handle(ev, turn){
  switch(ev.type){
    case "thread": threadId = ev.thread_id; break;
    case "tool": turn.addTool(ev.name, ev.args); break;
    case "policy": turn.addPolicy(ev); break;
    case "tool_result": turn.finishTool(ev.name, ev.guardrail, ev.content); break;
    case "token": turn.token(ev.text); break;
    case "escalated": turn.hold(); turn.fill(escalationCopy(ev.review), {escalated:true}); break;
    case "error": turn.fill(ev.message); break;
  }
}

function autosize(){ input.style.height="auto"; input.style.height = Math.min(input.scrollHeight, 140)+"px"; }
input.addEventListener("input", () => { autosize(); updateSend(); });
input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submit(); } });
form.addEventListener("submit", e => { e.preventDefault(); submit(); });

renderEmpty();
</script>
</body>
</html>
