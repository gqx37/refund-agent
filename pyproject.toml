[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refund-agent"
version = "0.1.0"
description = "A policy-constrained refund agent for Stripe: a tool-using LLM with a deterministic policy guardrail wired in as middleware."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # The harness: create_agent + middleware. The model is "good enough"; the
    # value is the tools and the guardrail middleware around it.
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-fireworks>=0.3.0",
    # Service + config.
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    # Integrations. Stripe is a hand-rolled httpx client (no stripe SDK on purpose,
    # see app/integrations/stripe/client.py). Facts live in embedded SQLite (stdlib).
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "langgraph-cli[inmem]>=0.2.0",  # `langgraph dev` local server + Studio
    "cryptography<44",  # pin to a version with prebuilt wheels (older macOS has no Rust)
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
